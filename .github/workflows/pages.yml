name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 无构建 = 文件拷贝：游戏发的是原生 ES module，站点内容 = 页面够得到的一切。
      # 拷贝清单在 PWA 与纹理落地后变长了：`icons/`（真 PNG 全套）、`manifest.webmanifest`、`sw.js`、
      # `assets/img/`（纸纹 + 特效贴图，css/game.css 与 js/render/fx.js 都够得到）。
      # 少拷一件的后果不是 CI 红，是玩家手机上"能打开但装不上 / 没底纹"——所以底下有一步自检兜着。
      # 仍然留在工件之外：server.cjs、tools/（闸与 bench）、docs/、assets/gen/（生成脚本，不是运行时资源），
      # 也顺手把 node_modules 留在外面 —— `path: .` 会连它一起上传。
      #
      # 拷哪些不写在这里——写在 tools/assemble-site.sh，本地闸与 CI 调同一支脚本。
      # 以前这里是手抄的三行 cp（index.html/css/js），于是页面后来引用的
      # manifest.webmanifest、sw.js、icons/* 全都上不了线：线上 404，而 CI 一路绿，
      # 因为没有任何一步加载过那份产物。服务器、台架、文档、node_modules 仍在 artifact 外面。
      - name: Assemble static site
        run: bash tools/assemble-site.sh _site
      - name: Deploy set gate (checks the very _site about to be uploaded)
        run: node tools/deploy-set.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
