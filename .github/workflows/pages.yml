name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 无构建 = 文件拷贝：游戏发的是原生 ES module，站点内容就是 index.html + css/ + js/。
      # 只有这些路径会从 index.html 里被够到。把 server.cjs、tools/（五道闸与 bench）、docs/
      # 留在工件之外，也顺手把 node_modules 留在外面 —— `path: .` 会连它一起上传。
      #
      # 版本三元组是真实存在的那一组：configure-pages@v5 / upload-pages-artifact@v3 / deploy-pages@v4。
      # 老的 (v3/v1/v2) 在 marketplace 上 404 而 run 仍然报绿 —— 那就是"部署悄悄停止部署"的形状。
      # Pages 必须先在仓库设置里开成 workflow 构建（本仓已开），否则 configure-pages@v5 直接红。
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r css js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
