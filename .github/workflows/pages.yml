name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 无构建 = 文件拷贝：游戏发的是原生 ES module，站点内容 = 页面够得到的一切。
      # 拷贝清单在 PWA 与纹理落地后变长了：`icons/`（真 PNG 全套）、`manifest.webmanifest`、`sw.js`、
      # `assets/img/`（纸纹 + 特效贴图，css/game.css 与 js/render/fx.js 都够得到）。
      # 少拷一件的后果不是 CI 红，是玩家手机上"能打开但装不上 / 没底纹"——所以底下有一步自检兜着。
      # 仍然留在工件之外：server.cjs、tools/（闸与 bench）、docs/、assets/gen/（生成脚本，不是运行时资源），
      # 也顺手把 node_modules 留在外面 —— `path: .` 会连它一起上传。
      #
      # 版本三元组是真实存在的那一组：configure-pages@v5 / upload-pages-artifact@v3 / deploy-pages@v4。
      # 老的 (v3/v1/v2) 在 marketplace 上 404 而 run 仍然报绿 —— 那就是"部署悄悄停止部署"的形状。
      # Pages 必须先在仓库设置里开成 workflow 构建（本仓已开），否则 configure-pages@v5 直接红。
      - name: Assemble static site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons _site/
          mkdir -p _site/assets
          cp -r assets/img _site/assets/
      # 上传前把工件当"已经部署的站点"读一遍：index.html 的每个 src/href、css/game.css 的每个 url()、
      # manifest 的每个 icons[].src，以及 **js/ 里以字符串字面量取的资产**（fx 层 new Image() 那两张贴图
      # —— 它取不到只走 onerror 改画圆点，html/css 两条腿照样全绿），全部按部署后的相对位置解析并核存在。
      # 这一步直接调仓内 `tools/dead-ref-check.mjs`，**不再抄一份内联正则**：内联副本与脚本在
      # 2026-10-03 实测已经分叉（副本查 13 条、脚本查 15 条），两份逻辑各查各的 = 等着线上缺图。
      # 两条腿各自红过的真实读数：`MISS css/game.css → ../assets/img/paper-256.png`（拷贝清单补
      # assets/img/ 之前）、`MISS js/render/fx.js(asset) → assets/img/sparks-256.png`（把那张图集
      # 从工件里删掉的阴性对照，15 条缺 1，rc=1）。
      - name: Deployed artifact has no dead reference
        run: node tools/dead-ref-check.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
